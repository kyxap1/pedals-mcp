name: Deploy

# Worker code only. Reloading the data is a different event with a different
# trigger, so it lives in rebuild.yml: a failure here must not stop a reload,
# and a reload must not wait on a deploy. A push does start one, once the
# deploy is live, because the schema in the Worker only reaches D1 through a
# load.
on:
  push:
    branches: [master]
    paths:
      - src/**
      - schema.mjs
      - wrangler.toml
      - package.json
      - package-lock.json
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      # kyxap1/pedals is public, so the cross-repo checkout needs no token.
      - uses: actions/checkout@v7
        with:
          repository: kyxap1/pedals
          path: manuals

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          PEDALS_ROOT: manuals

      # Uploads the script and writes this Worker's own subdomain settings;
      # both are in reach of a token scoped to this Worker alone. It prints
      # "No targets deployed" because no route is declared — see wrangler.toml.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - if: github.event_name == 'push'
        run: gh workflow run rebuild.yml --repo "$GITHUB_REPOSITORY" -f cause="Deploy of ${GITHUB_SHA::7}"
        env:
          GH_TOKEN: ${{ github.token }}
