name: Rebuild

# The manuals change at most once a day and a full rebuild writes ~1355 rows,
# so the D1 free quota (100K writes/day) allows ~73 of these. Trigger, not cron.
on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # kyxap1/pedals is public, so the cross-repo checkout needs no token.
      - uses: actions/checkout@v4
        with:
          repository: kyxap1/pedals
          path: manuals

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          PEDALS_ROOT: manuals

      # Deploy before loading: the schema the Worker applies ships with it.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Load the manuals into D1
        env:
          MCP_URL: https://pedals-mcp.kyxap.pro
          DB_WRITE_TOKEN: ${{ secrets.DB_WRITE_TOKEN }}
        run: node load.mjs manuals
