name: Rebuild

# Data only; the Worker is deployed by deploy.yml. Nothing here holds a
# Cloudflare credential — the rows go to the Worker's /load route over HTTPS.
#
# Only the pedals that changed are rewritten (see load.mjs). Trigger, not cron:
# kyxap1/pedals dispatches this when a manual changes.
#
# A dispatch always reads "Manually run by" whoever owns the token, so the
# dispatcher names the real cause and it becomes the run's title.
run-name: ${{ inputs.cause || 'Rebuild' }}
on:
  workflow_dispatch:
    inputs:
      cause:
        description: What triggered this load
        required: false

# Two loads at once would both rewrite the same pedals. A queued run waits its turn.
concurrency:
  group: rebuild

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # kyxap1/pedals is public, so the cross-repo checkout needs no token.
      - uses: actions/checkout@v7
        with:
          repository: kyxap1/pedals
          path: manuals

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          PEDALS_ROOT: manuals

      - name: Load the manuals into D1
        env:
          MCP_URL: https://pedals-mcp.kyxap.pro
          DB_WRITE_TOKEN: ${{ secrets.DB_WRITE_TOKEN }}
        run: node load.mjs manuals

      # A load is many requests, not one transaction, so the only proof it
      # landed whole is querying it back through the tools.
      - name: Check every tool against the loaded database
        env:
          MCP_URL: https://pedals-mcp.kyxap.pro
        run: node e2e.mjs
