name: Rebuild

# The manuals change at most once a day and a full rebuild writes ~1355 rows,
# so the D1 free quota (100K writes/day) allows ~73 of these. Trigger, not cron.
on:
  repository_dispatch:
    types: [manuals-changed]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # kyxap1/pedals is public, so the cross-repo checkout needs no token.
      - uses: actions/checkout@v4
        with:
          repository: kyxap1/pedals
          path: manuals

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          PEDALS_ROOT: manuals

      - run: node build-db.mjs manuals dist/pedals.sql

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 execute pedals --remote --yes --file dist/pedals.sql
