name = "pedals-mcp"
main = "src/index.js"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# A deploy overwrites the Worker's remote configuration with this file, so the
# Custom Domain has to be declared here: leaving it out detaches
# pedals-mcp.kyxap.pro from the Worker.
[[routes]]
pattern = "pedals-mcp.kyxap.pro"
zone_name = "kyxap.pro"
custom_domain = true
enabled = true
previews_enabled = false

[observability]
enabled = true

[observability.logs]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "pedals-mcp"
database_id = "e265b985-858a-4c62-893a-feb1a5b47112"
