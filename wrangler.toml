name = "pedals-mcp"
main = "src/index.js"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]
# Both off so a deploy needs nothing account-wide: resolving the workers.dev
# subdomain is an account-level read, and the CI token is scoped to this Worker.
# pedals-mcp.kyxap.pro is the only entrance.
workers_dev = false
preview_urls = false

# The Custom Domain is attached once, by hand, and deliberately not declared
# here: wrangler only touches the domains API for routes this file lists, so an
# undeclared one is left alone. Declaring it would make every deploy re-assert
# the DNS record, which needs zone access the CI token does not have.

[observability]
enabled = true

[observability.logs]
enabled = true

# Per client IP, on the MCP routes only. Generous for a handful of concurrent
# sessions; it is there to stop a runaway client, not to meter normal use.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 10 }

[[d1_databases]]
binding = "DB"
database_name = "pedals-mcp"
database_id = "e265b985-858a-4c62-893a-feb1a5b47112"
